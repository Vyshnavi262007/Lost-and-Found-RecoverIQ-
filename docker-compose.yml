# OPTIONAL. The simple Windows setup in README.md does not need Docker.
# Starts PostgreSQL only; run Django/Vite on your machine with DB_ENGINE=postgres.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: recoveriq
      POSTGRES_USER: recoveriq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
